<!-- navbar.html -->
<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('main.index', reset='all') }}" class="nav-logo-container">
            <img src="https://dfpsbewjkvhrietohwes.supabase.co/storage/v1/object/public/website_design/_5948c65b-2408-4c52-b7f2-41c3ebe52387-removebg-preview.png" alt="AfriGuide Logo" class="nav-logo">
            <span class="nav-brand-text">AfriGuide</span>
        </a>
    </div>
    <button class="navbar-toggle" id="navbar-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="nav-right" id="nav-right">
        <a href="/">Home</a>
        {% if session.get('country') %}
            <a href="/step1">Preferences</a>
        {% else %}
            <a href="#" class="disabled-link" title="Pick a country first">Preferences</a>
        {% endif %}
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('itinerary.my_trips_route') }}">My Trips</a>
            <span class="nav-username">{{ current_user.username }}</span>
            <a href="{{ url_for('auth.logout_route') }}">Log Out</a>
        {% else %}
            <a href="{{ url_for('auth.login_route') }}">Log In</a>
        {% endif %}
    </div>
</div>

<script>
    // Hamburger menu toggle
    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('navbar-toggle');
        const navRight = document.getElementById('nav-right');
        
        if (toggle && navRight) {
            toggle.addEventListener('click', function() {
                navRight.classList.toggle('active');
                toggle.classList.toggle('active');
            });
        }
    });
</script>
